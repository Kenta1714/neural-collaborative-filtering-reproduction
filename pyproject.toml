[project]
name = "dl-paper-reproductions"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3.4",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.6",
    "scipy>=1.18.1",
    "torch>=2.13.0",
    "tqdm>=4.69.0",
    "wandb>=0.28.1",
]

# CUDAビルドの切り替え用。extraを付けない場合はPyPIの既定ホイール(cu130)が入る。
# ドライバが古い環境では `uv sync --extra cu126` のように明示する。
[project.optional-dependencies]
cu126 = ["torch>=2.13.0", "torchvision>=0.28.0"]
cu130 = ["torch>=2.13.0", "torchvision>=0.28.0"]

[tool.uv]
# この宣言がないと解決が1本に畳まれ、extraなしの場合まで片方のビルドが選ばれる。
conflicts = [[{ extra = "cu126" }, { extra = "cu130" }]]

# explicit = true により、tool.uv.sourcesで名指ししたパッケージにだけこのindexを使う。
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu130", extra = "cu130" },
]
